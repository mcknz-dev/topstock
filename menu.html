<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>819.tools</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&display=swap"
            rel="stylesheet"
    >

    <style>
        .menu-page {
            width: 100%;
            max-width: 680px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 40px 24px;
            box-sizing: border-box;
        }

        .menu-brand {
            margin: 12px 0 64px;
            text-align: center;
            font-family: 'Bruno Ace SC', sans-serif;
            font-size: 30px;
            font-weight: 400;
        }

        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .tool-tile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            width: 100%;
            min-height: 145px;
            padding: 28px;

            box-sizing: border-box;

            background: #111;
            color: white;

            border-radius: 30px;
            text-decoration: none;

            transition:
                    transform 0.15s ease,
                    background 0.15s ease;
        }

        a.tool-tile:hover {
            background: #252525;
            transform: translateY(-2px);
        }

        a.tool-tile:active {
            transform: scale(0.99);
        }

        .tool-title {
            margin: 0 0 10px;
            font-size: 23px;
            font-weight: 700;
        }

        .tool-description {
            margin: 0;
            color: #c4c4c4;
            font-size: 14px;
            line-height: 1.5;
        }

        .tool-arrow {
            flex-shrink: 0;
            font-size: 30px;
            color: #aaa;
        }

        /* Coming soon tiles */

        .coming-soon-tile {
            background: #e9e9e9;
            color: #777;
            border: 1px solid #dedede;
        }

        .coming-soon-tile .tool-title {
            color: #555;
        }

        .coming-soon-tile .tool-description {
            color: #888;
        }

        .coming-soon-label {
            flex-shrink: 0;
            padding: 8px 12px;
            background: #dedede;
            color: #777;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .coming-soon-message {
            margin: 32px 0 0;
            text-align: center;
            color: #999;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 400px) {
            .menu-page {
                padding: 32px 20px;
            }

            .menu-brand {
                margin-bottom: 48px;
                font-size: 26px;
            }

            .tool-list {
                gap: 14px;
            }

            .tool-tile {
                min-height: 125px;
                padding: 22px;
                border-radius: 24px;
            }

            .tool-title {
                font-size: 19px;
            }

            .tool-description {
                font-size: 13px;
            }

            .coming-soon-label {
                padding: 7px 9px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<main class="menu-page">

    <header>
        <h1 class="menu-brand">819.tools</h1>
    </header>

    <section class="tool-list" aria-label="Available tools">

        <!-- Active tool -->

        <a
                class="tool-tile"
                href="home.html"
        >
            <div>
                <h2 class="tool-title">
                    Costume Top Stock
                </h2>

                <p class="tool-description">
                    Costume top stock inventory, quantities and locations.
                </p>
            </div>

            <span class="tool-arrow" aria-hidden="true">→</span>
        </a>

        <!-- Future tool 1 -->

        <div class="tool-tile coming-soon-tile">

            <div>
                <h2 class="tool-title">
                    Coming Soon
                </h2>

                <p class="tool-description">
                    Something new is on the way.
                </p>
            </div>

            <span class="coming-soon-label">
                    SOON
                </span>

        </div>

        <!-- Future tool 2 -->

        <div class="tool-tile coming-soon-tile">

            <div>
                <h2 class="tool-title">
                    Coming Soon
                </h2>

                <p class="tool-description">
                    More tools are in development.
                </p>
            </div>

            <span class="coming-soon-label">
                    SOON
                </span>

        </div>

    </section>


</main>

</body>

</html>
